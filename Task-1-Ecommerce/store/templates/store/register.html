{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | NOVA.</title>

    <link rel="stylesheet" href="{% static 'store/style.css' %}">
</head>

<body>

<header class="navbar">
    <a href="{% url 'home' %}" class="logo">
    NOVA.
</a>

    <nav>
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'home' %}#products">Shop</a>
        <a href="{% url 'cart' %}">Cart</a>
        <a href="{% url 'login' %}">Login</a>
    </nav>
</header>


<main class="auth-page">

    <div class="auth-box">

        <p class="auth-label">JOIN NOVA STORE</p>

        <h1>Create Account</h1>

        {% if messages %}
            {% for message in messages %}
                <p class="error-message">
                    {{ message }}
                </p>
            {% endfor %}
        {% endif %}


        <form method="POST">

            {% csrf_token %}

            <label>Username</label>

            <input
                type="text"
                name="username"
                required
            >


            <label>Email</label>

            <input
                type="email"
                name="email"
                required
            >


            <label>Password</label>

            <input
                type="password"
                name="password"
                required
            >


            <label>Confirm Password</label>

            <input
                type="password"
                name="confirm_password"
                required
            >


            <button type="submit">
                Create Account
            </button>

        </form>


        <p class="auth-switch">
            Already have an account?

            <a href="{% url 'login' %}">
                Login
            </a>
        </p>

    </div>

</main>

</body>
</html>
