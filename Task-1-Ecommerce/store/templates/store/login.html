{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | NOVA.</title>

    <link rel="stylesheet" href="{% static 'store/style.css' %}">
</head>

<body>

<header class="navbar">

    <a href="{% url 'home' %}" class="logo">
    NOVA.
</a>

    <nav>
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'home' %}#products">Shop</a>
        <a href="{% url 'cart' %}">Cart</a>
        <a href="{% url 'register' %}">Register</a>
    </nav>

</header>


<main class="auth-page">

    <div class="auth-box">

        <p class="auth-label">WELCOME BACK</p>

        <h1>Login</h1>


        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Login
            </button>

        </form>


        <p class="auth-switch">

            Don't have an account?

            <a href="{% url 'register' %}">
                Create one
            </a>

        </p>

    </div>

</main>

</body>
</html>
